{% load static pos_extras %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Z-Report — Session #{{ session.id }}</title>
  <style>
    @page { size: letter portrait; margin: 0.5in; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: #1f2937;
      margin: 0;
      padding: 0;
    }
    .max-w-2xl { max-width: 42rem; margin: 0 auto; }
    .border-b { border-bottom: 1px solid #e5e7eb; }
    .border-t-2 { border-top: 2px solid #d1d5db; }
    .border-gray-200 { border-color: #e5e7eb; }
    .border-gray-300 { border-color: #d1d5db; }
    .pb-4 { padding-bottom: 1rem; }
    .pb-2 { padding-bottom: 0.5rem; }
    .pt-2 { padding-top: 0.5rem; }
    .py-1\\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .p-6 { padding: 1.5rem; }
    .p-4 { padding: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mt-1 { margin-top: 0.25rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .uppercase { text-transform: uppercase; }
    .capitalize { text-transform: capitalize; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-700 { color: #374151; }
    .text-gray-800 { color: #1f2937; }
    .text-gray-900 { color: #111827; }
    .text-green-600 { color: #059669; }
    .text-red-600 { color: #dc2626; }
    .text-yellow-600 { color: #d97706; }
    .bg-gray-50 { background-color: #f9fafb; }
    .rounded-lg { border-radius: 0.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; }
    th.pb-2 { padding-bottom: 0.5rem; }
    td { padding: 0.25rem 0; }
    .divide-y-100 tr:not(:last-child) { border-bottom: 1px solid #f3f4f6; }
    .gap-4 { gap: 1rem; }
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: 1fr 1fr; }
    .ml-1 { margin-left: 0.25rem; }
    .w-full { width: 100%; }
    .bg-white { background-color: #fff; }
    .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .border { border: 1px solid #e5e7eb; }
    .rounded-xl { border-radius: 0.75rem; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 1rem 0; }
    table tbody tr { border-bottom: 1px solid #f3f4f6; }
    table thead tr { border-bottom: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <div class="max-w-2xl p-6">
    {% include 'sales/close/partials/zreport_content.html' %}
  </div>
</body>
</html>
