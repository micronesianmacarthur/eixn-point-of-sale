<div class="bg-white rounded-xl shadow-sm border border-gray-200 mt-4 p-4">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider"><i class="fas fa-cubes mr-1 text-indigo-500"></i> Bundles</h3>
    <span class="text-[10px] text-gray-400">{{ bundles|length }} available</span>
  </div>
  <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
    {% for b in bundles %}
    <button type="button"
            @click="addBundle({{ b.id }})"
            class="flex flex-col items-center justify-center px-2 py-3 rounded-lg border border-gray-200 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-300 transition text-center">
      <span class="text-[11px] font-medium text-gray-800 leading-tight">{{ b.name }}</span>
      <span class="text-[10px] text-gray-500 mt-0.5">{{ b.item_count }} item{{ b.item_count|pluralize }}</span>
      <span class="text-[10px] text-indigo-600 font-semibold">${{ b.total_normal|floatformat:2 }}</span>
    </button>
    {% empty %}
    <p class="col-span-full text-xs text-gray-400 text-center py-2">No bundles configured.</p>
    {% endfor %}
  </div>
</div>
