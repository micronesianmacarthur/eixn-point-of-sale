<div class="bg-white rounded-xl shadow-sm border border-gray-200 mt-4 p-4">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider"><i class="fas fa-bolt mr-1 text-yellow-500"></i> Quick Services</h3>
    <span class="text-[10px] text-gray-400">100% margin</span>
  </div>
  <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
    {% for p in service_products %}
    <button type="button"
            @click="addItem({id: {{ p.id }}, name: '{{ p.name|escapejs }}', price: {{ p.retail_price }}, sku: '{{ p.sku|escapejs }}', stock: 999999, is_service: true, is_variable_weight: false})"
            class="flex flex-col items-center justify-center px-2 py-3 rounded-lg border border-gray-200 bg-gray-50 hover:bg-blue-50 hover:border-blue-300 transition text-center">
      <span class="text-[11px] font-medium text-gray-800 leading-tight">{{ p.name }}</span>
      <span class="text-[10px] text-blue-600 font-semibold mt-0.5">${{ p.retail_price|floatformat:2 }}</span>
    </button>
    {% empty %}
    <p class="col-span-full text-xs text-gray-400 text-center py-2">No service items configured.</p>
    {% endfor %}
  </div>
</div>
