<div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
  <span class="text-sm font-semibold text-gray-700">Top Items &mdash; {{ range_label }}</span>
  <div class="flex rounded-lg bg-gray-100 p-0.5 text-xs">
    {% for key, label in ranges %}
    <button
      type="button"
      class="px-2.5 py-1 rounded-md transition {% if range == key %}bg-white shadow text-gray-800 font-medium{% else %}text-gray-500 hover:text-gray-700{% endif %}"
      hx-get="{% url 'sales:top_products' %}?range={{ key }}"
      hx-target="#top-products-panel"
      hx-swap="innerHTML">{{ label }}</button>
    {% endfor %}
  </div>
</div>

{% if products %}
<div class="overflow-y-auto max-h-60">
  <table class="w-full text-sm">
    <thead><tr class="text-left text-gray-500 text-xs uppercase border-b border-gray-100">
      <th class="sticky top-0 bg-white px-4 py-3">Product</th>
      <th class="sticky top-0 bg-white px-4 py-3 text-right">Sold</th>
      <th class="sticky top-0 bg-white px-4 py-3 text-right">Revenue</th>
    </tr></thead>
  <tbody class="divide-y divide-gray-100">
    {% for p in products %}
    <tr class="hover:bg-gray-50">
      <td class="px-4 py-3">
        <div class="font-medium text-gray-800">{{ p.product__name }}</div>
        <div class="text-xs text-gray-400">{{ p.product__sku }}</div>
      </td>
      <td class="px-4 py-3 text-right text-gray-600">{{ p.total_qty }}</td>
      <td class="px-4 py-3 text-right text-gray-800 font-medium">${{ p.total_revenue|floatformat:2 }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<div class="p-6 text-center text-gray-400 text-sm">No sales in this period.</div>
{% endif %}
