{% if q %}
  {% if products %}
    {% for p in products %}
    <button type="button"
            @click="addItem({
              id: {{ p.id }},
              name: '{{ p.name|escapejs }}',
              sku: '{{ p.sku|escapejs }}',
              price: {{ p.discount_price|default:p.retail_price|stringformat:'.2f' }},
              stock: {{ p.stock_quantity }},
              is_variable_weight: {{ p.is_variable_weight|yesno:'true,false' }},
              is_service: {{ p.is_service|yesno:'true,false' }}
            })"
            class="w-full text-left px-4 py-3 hover:bg-gray-50 border-b border-gray-100 transition flex items-center justify-between">
      <div>
        <div class="font-medium text-gray-800">{{ p.name }}</div>
        <div class="text-xs text-gray-500">{{ p.sku }}{% if not p.is_service %} &middot; Stock: {{ p.stock_quantity }}{% endif %}</div>
      </div>
      <div class="text-right">
        {% if p.is_on_sale %}
        <div class="font-semibold text-gray-800">${{ p.discount_price|floatformat:2 }}</div>
        <div class="text-xs text-red-500 line-through">${{ p.retail_price|floatformat:2 }}</div>
        {% else %}
        <div class="font-semibold text-gray-800">${{ p.retail_price|floatformat:2 }}</div>
        {% endif %}
      </div>
    </button>
    {% endfor %}
  {% else %}
    <div class="px-4 py-6 text-center text-gray-500">No products found.</div>
  {% endif %}
{% else %}
  <div class="px-4 py-6 text-center text-gray-400">Type to search products...</div>
{% endif %}
