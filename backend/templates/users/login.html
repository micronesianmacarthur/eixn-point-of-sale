{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — {{ business.business_name|default:"EIXN POS" }}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/fontawesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/solid.min.css' %}">
    <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>
</head>
<body class="bg-gradient-to-br from-brand-700 via-brand-800 to-ink-950 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md" x-data="{ pinMode: true }">
        <div class="text-center mb-8">
            <i class="fas fa-cash-register text-white text-5xl mb-3"></i>
            <h1 class="text-3xl font-bold text-white">{{ business.business_name|default:"EIXN POS" }}</h1>
        </div>
        <div class="bg-white rounded-2xl shadow-pop p-8">
            <h2 class="text-xl font-semibold text-ink-900 mb-6 text-center">Sign In</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-sm font-medium text-ink-700 mb-1" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" autocomplete="username" class="w-full rounded-lg border border-ink-300 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-ink-700 mb-1" for="id_password">
                        <span x-show="pinMode">PIN Code</span>
                        <span x-show="!pinMode">Password</span>
                    </label>
                    <input type="password" name="password" id="id_password" autocomplete="current-password" class="w-full rounded-lg border border-ink-300 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500" :placeholder="pinMode ? 'Enter your PIN' : 'Enter your password'" required>
                </div>
                {% if form.non_field_errors %}
                    <div class="mb-4 p-3 bg-rose-50 text-rose-600 rounded-lg text-sm">{{ form.non_field_errors }}</div>
                {% endif %}
                <button type="submit" class="btn-primary w-full py-2.5">
                    <span x-show="pinMode">Sign In with PIN</span>
                    <span x-show="!pinMode">Sign In</span>
                </button>
                <div class="mt-3 text-center">
                    <button type="button" @click="pinMode = !pinMode" class="text-sm font-medium text-brand-700 hover:text-brand-900 hover:underline">
                        <span x-show="pinMode">Login with password</span>
                        <span x-show="!pinMode">Login with PIN</span>
                    </button>
                </div>
            </form>
        </div>
        <p class="text-center text-brand-100/80 text-sm mt-6">{{ business.business_name|default:"EIXN POS" }} &copy; {% now "Y" %}</p>
    </div>
</body>
</html>
